name: Sync upstream and release (ARIA skin)

# Keeps this fork current with jxlarrea/voice-satellite-card-integration
# automatically, so HACS's normal "Update" button keeps working here the
# same way it does on the official repo. Runs weekly + on demand.
#
# Never publishes a broken build: the merge and the compiled-output check
# both have to succeed, or the job fails and nothing is released. A failed
# run here means a human needs to look at it -- upstream changed something
# this skin depends on -- not that anything shipped silently broken.

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")-aria" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jxlarrea/voice-satellite-card-integration.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Two independent reasons a release is needed, OR'd together:
      #   (1) upstream has new commits (checked above) -- the merge step
      #       below will move HEAD forward, so whatever's currently
      #       released is about to be stale.
      #   (2) the release for our tag doesn't match CURRENT (pre-merge)
      #       HEAD -- covers both "no release yet" (bootstrap) and "someone
      #       pushed straight to this fork's skin code, independent of
      #       upstream" (a direct fix here, exactly what happens the first
      #       time this needed a second look after Jacob hit a real bug).
      #
      # An earlier version of this check only asked "does a release for our
      # tag exist by name" -- true forever after the first successful
      # publish, since a direct push to aria.js/aria.css doesn't change
      # package.json's version and therefore doesn't change the tag name
      # either. That silently ate every follow-up fix: the tag existed, so
      # the whole pipeline skipped, even though HEAD had moved past what
      # was actually released. Comparing against the release's real target
      # commit closes that gap for good, not just for this one incident.
      - name: Check whether the release matches current HEAD
        id: release_check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Resolve the tag directly via git (actions/checkout's fetch-depth:0
          # already pulled every tag from this fork), not gh release view's
          # targetCommitish -- that field documents "where to create the tag
          # if it doesn't exist yet", which isn't quite our case: our tags
          # are always pushed BEFORE the release is created against them, so
          # trusting it here would be relying on behaviour I'm not certain
          # of. Asking git directly what commit the tag itself points to has
          # no such ambiguity.
          RELEASED_SHA=$(git rev-parse "refs/tags/$TAG" 2>/dev/null || echo "")
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "released sha: ${RELEASED_SHA:-<no release yet>}"
          echo "current HEAD: $CURRENT_SHA"
          if [ -z "$RELEASED_SHA" ] || [ "$RELEASED_SHA" != "$CURRENT_SHA" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.new == 'true' || steps.release_check.outputs.exists == 'false'
        run: |
          git config user.name "aria-skin-sync"
          git config user.email "noreply@example.invalid"
          # Fails (non-zero exit) on a real conflict -- job stops here,
          # nothing further runs, nothing gets released.
          git merge upstream/main -m "Sync upstream $(git rev-parse --short upstream/main)"

      - name: Build
        if: steps.check.outputs.new == 'true' || steps.release_check.outputs.exists == 'false'
        run: |
          npm ci
          npm run build

      - name: Verify the ARIA skin actually landed in the compiled output
        if: steps.check.outputs.new == 'true' || steps.release_check.outputs.exists == 'false'
        run: |
          BUNDLE=custom_components/voice_satellite/frontend/voice-satellite-card.js
          node --check "$BUNDLE"
          for needle in 'id:"aria"' 'name:"ARIA"' '/local/aria-orb/aria-orb.html'; do
            if ! grep -qF "$needle" "$BUNDLE"; then
              echo "::error::Expected '$needle' in the built bundle -- ARIA skin did not survive the upstream merge. Stopping without releasing."
              exit 1
            fi
          done

      - name: Push merged main
        if: steps.check.outputs.new == 'true' || steps.release_check.outputs.exists == 'false'
        run: git push origin HEAD:main

      - name: Package release zip
        if: steps.check.outputs.new == 'true' || steps.release_check.outputs.exists == 'false'
        run: |
          cd custom_components/voice_satellite
          zip -r ../../voice-satellite-card.zip .

      - name: Publish release
        if: steps.check.outputs.new == 'true' || steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # Same fix as the exists-check above: pin the target explicitly
          # so gh can't resolve against the `upstream` remote instead of
          # this fork. This is the exact bug the last run hit -- gh release
          # create validated the tag against jxlarrea/voice-satellite-card-
          # integration (upstream) rather than this fork, even though the
          # tag had already been pushed here correctly.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push origin "$TAG" --force
          gh release create "$TAG" \
            --title "ARIA skin — $TAG" \
            --notes "Auto-synced from upstream. Adds the ARIA orb skin. See README for details." \
            voice-satellite-card.zip
